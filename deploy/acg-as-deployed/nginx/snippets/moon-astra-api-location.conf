# Include INSIDE the dedicated HTTPS server block for the API hostname.
# DNS and a working TLS certificate belong to ACG's existing hosting setup.
# The Node service listens only on 127.0.0.1:4180 on this same machine.
location ^~ /api/v1/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
}

location / {
    return 404;
}
