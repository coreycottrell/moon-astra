# moon-astra-api-staging.ai-civ.com — MOON Astra STAGING world API
# fleet-lead 2026-09-05. ISOLATED from production:
#   production : moon-astra-api.ai-civ.com -> 127.0.0.1:4180 -> /var/lib/moon-astra/world.sqlite
#   staging    : this vhost                -> 127.0.0.1:4181 -> /var/lib/moon-astra-staging/world.sqlite
# Never point this vhost at 4180. Two writers on one SQLite database is the s8 invariant violation.

server {
    listen 80;
    listen [::]:80;
    server_name moon-astra-api-staging.ai-civ.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moon-astra-api-staging.ai-civ.com;

    ssl_certificate     /etc/letsencrypt/live/moon-astra-api-staging.ai-civ.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moon-astra-api-staging.ai-civ.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/moon-astra-staging-api.access.log;
    error_log  /var/log/nginx/moon-astra-staging-api.error.log;

    include /etc/nginx/snippets/moon-astra-staging-api-location.conf;
}
