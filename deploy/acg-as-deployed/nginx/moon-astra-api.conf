# moon-astra-api.ai-civ.com — MOON Astra shared-world API
# fleet-lead 2026-09-05. Node service is loopback-only on 127.0.0.1:4180.
# The /api/v1/ location is the reviewed template from
# moon-civilization/deploy/nginx-moon-astra-api.conf, included verbatim.

server {
    listen 80;
    listen [::]:80;
    server_name moon-astra-api.ai-civ.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moon-astra-api.ai-civ.com;

    ssl_certificate     /etc/letsencrypt/live/moon-astra-api.ai-civ.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moon-astra-api.ai-civ.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/moon-astra-api.access.log;
    error_log  /var/log/nginx/moon-astra-api.error.log;

    # Reviewed location snippet: preserves /api/v1/... to 127.0.0.1:4180,
    # forwards Authorization / Idempotency-Key / original Origin, caching off,
    # and returns 404 for everything else.
    include /etc/nginx/snippets/moon-astra-api-location.conf;
}
