# New v2 route only; existing /api/v1/ remains unchanged.
location ^~ /api/moon-astra-v2/v1/ {
    proxy_pass http://127.0.0.1:4182/api/v1/;
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    access_log /var/log/nginx/moon-astra-v2.access.log;
}
