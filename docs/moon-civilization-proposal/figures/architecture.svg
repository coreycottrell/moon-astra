<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="706" viewBox="0 0 1200 706" role="img" aria-label="Proposed system architecture">
<title>Proposed system architecture</title><desc>Human and AI interfaces enter one world service. A versioned simulation and durable state power the live world. Isolated labs reuse the same transitions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71849a"/></marker></defs>
<rect width="1200" height="706" rx="16" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#182537"><text x="36" y="45" font-size="23" font-weight="700">ONE WORLD. ONE SET OF RULES.</text><text x="36" y="73" font-size="14" fill="#526174">Different interfaces share authoritative commands, observations, and economic transitions.</text><rect x="36" y="110" width="348" height="84" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="54" y="139" font-size="17" font-weight="700">Human browser</text><text x="54" y="162" font-size="13" fill="#526174">3D world • plans • projects</text><path d="M210,200 L210,237" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="110" width="348" height="84" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="444" y="139" font-size="17" font-weight="700">AICIV clients</text><text x="444" y="162" font-size="13" fill="#526174">HTTP / MCP • scoped identity</text><path d="M600,200 L600,237" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="816" y="110" width="348" height="84" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="834" y="139" font-size="17" font-weight="700">Observers</text><text x="834" y="162" font-size="13" fill="#526174">Visible events • history</text><path d="M990,200 L990,237" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="246" width="1128" height="92" rx="12" fill="#e6f2ed" stroke="#ccd8e6"/><text x="54" y="275" font-size="17" font-weight="700">World service and command gateway</text><text x="54" y="298" font-size="13" fill="#526174">Authorization • visibility • idempotency • budgets • receipts • subscriptions</text><path d="M330,344 L330,383" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><path d="M890,383 L890,344" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="394" width="552" height="107" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="54" y="423" font-size="17" font-weight="700">Versioned headless simulation</text><text x="54" y="446" font-size="13" fill="#526174">One authoritative live clock • deterministic policies</text><text x="54" y="466" font-size="13" fill="#526174">Located materials • utility graphs • accountable construction</text><rect x="612" y="394" width="552" height="107" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="630" y="423" font-size="17" font-weight="700">Durable world and event history</text><text x="630" y="446" font-size="13" fill="#526174">Transactional accounting • checkpoints • recovery</text><text x="630" y="466" font-size="13" fill="#526174">Versioned assets • deployment lineage • filtered read models</text><path d="M590,447 L608,447" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><path d="M310,507 L310,541 L600,541 L600,562" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="574" width="760" height="104" rx="12" fill="#fff4de" stroke="#e5cd95"/><text x="238" y="603" font-size="17" font-weight="700">Isolated laboratory: same transitions, controlled clock</text><text x="238" y="626" font-size="13" fill="#526174">Seeded scenarios • Gymnasium / PettingZoo adapters • design trials</text><text x="238" y="646" font-size="13" fill="#526174">No live resource transfer • no hidden information in player forecasts</text></g></svg>