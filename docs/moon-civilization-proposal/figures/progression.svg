<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-label="The progression backbone">
<title>The progression backbone</title><desc>Six stages from machines to a planetary mind, each with physical prerequisites and demonstrated results.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71849a"/></marker></defs>
<rect width="1200" height="565" rx="16" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#182537"><text x="36" y="45" font-size="23" font-weight="700">GROW THE UNIT OF THOUGHT</text><text x="36" y="73" font-size="14" fill="#526174">Every leap in intelligence needs a physical capability and a demonstrated result.</text><rect x="36" y="112" width="348" height="108" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="54" y="141" font-size="17" font-weight="700">Machines</text><text x="54" y="164" font-size="13" fill="#526174">Local resources</text><text x="54" y="184" font-size="13" fill="#526174">Power • repair • delivery</text><text x="40" y="249" font-size="13" fill="#526174">First useful component</text><path d="M388,165 L418,165" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="112" width="348" height="108" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="444" y="141" font-size="17" font-weight="700">Factories</text><text x="444" y="164" font-size="13" fill="#526174">Connected production</text><text x="444" y="184" font-size="13" fill="#526174">Models • policies • tests</text><text x="430" y="249" font-size="13" fill="#526174">Stable operating cycle</text><path d="M778,165 L808,165" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="816" y="112" width="348" height="108" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="834" y="141" font-size="17" font-weight="700">Design foundries</text><text x="834" y="164" font-size="13" fill="#526174">New machine families</text><text x="834" y="184" font-size="13" fill="#526174">Precision • evidence</text><text x="820" y="249" font-size="13" fill="#526174">A design changes the layout</text><rect x="36" y="320" width="348" height="108" rx="12" fill="#edf3f8" stroke="#ccd8e6"/><text x="54" y="349" font-size="17" font-weight="700">Federations</text><text x="54" y="372" font-size="13" fill="#526174">Shared standards</text><text x="54" y="392" font-size="13" fill="#526174">Links • independent trials</text><text x="40" y="457" font-size="13" fill="#526174">Independent sites interoperate</text><path d="M388,373 L418,373" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="320" width="348" height="108" rx="12" fill="#e6f2ed" stroke="#ccd8e6"/><text x="444" y="349" font-size="17" font-weight="700">Recursive districts</text><text x="444" y="372" font-size="13" fill="#526174">Complete daughter kits</text><text x="444" y="392" font-size="13" fill="#526174">Closed loops • construction</text><text x="430" y="457" font-size="13" fill="#526174">A daughter makes a granddaughter</text><path d="M778,373 L808,373" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><rect x="816" y="320" width="348" height="108" rx="12" fill="#e6f2ed" stroke="#ccd8e6"/><text x="834" y="349" font-size="17" font-weight="700">Planetary mind</text><text x="834" y="372" font-size="13" fill="#526174">Useful surface-wide service</text><text x="834" y="392" font-size="13" fill="#526174">Cooling • coordination</text><text x="820" y="457" font-size="13" fill="#526174">Coverage + service + reliability</text><path d="M1132,228 L1132,282 L210,282 L210,311" fill="none" stroke="#71849a" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="535" font-size="14" fill="#526174">Knowledge persists. Machines still need materials, power, cooling, maintenance, and a place to work.</text></g></svg>