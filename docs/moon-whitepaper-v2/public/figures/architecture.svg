<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" role="img" aria-labelledby="t d"><title id="t">One world, several ways to participate</title><desc id="d">Human, agent and observer clients use the same command authority. The renderer and external model calls are outside economic transitions. Laboratory runs use isolated state.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#e3ac70"/></marker><linearGradient id="ground" x2="0.8" y2="1"><stop stop-color="#33494f"/><stop offset="1" stop-color="#172b32"/></linearGradient></defs><rect width="1240" height="670" fill="#102026" rx="5"/><style>text{font-family:system-ui,Arial,sans-serif;fill:#e7e9df}.small{font-size:15px;fill:#a6b6ba}.tag{font-family:monospace;font-size:12px;fill:#e3ac70;letter-spacing:2px}.label{font-size:19px}.muted{fill:#88a4ad}</style><text x="35" y="42" class="tag" >ARCHITECTURE / ONE SHARED ECONOMY</text><rect x="90" y="85" width="330" height="92" rx="4" fill="#152a32" stroke="#3c5861"/><text x="106" y="117" class="label" >Human browser</text><text x="106" y="143" class="small" >Place • inspect • plan</text><path d="M255 180v33H620v28" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="455" y="85" width="330" height="92" rx="4" fill="#152a32" stroke="#3c5861"/><text x="471" y="117" class="label" >AICIV runner</text><text x="471" y="143" class="small" >Observe • commit • learn</text><path d="M620 180v33H620v28" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="820" y="85" width="330" height="92" rx="4" fill="#152a32" stroke="#3c5861"/><text x="836" y="117" class="label" >Observer</text><text x="836" y="143" class="small" >Visit • watch • replay</text><path d="M985 180v33H620v28" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="205" y="245" width="830" height="103" rx="4" fill="#152a32" stroke="#3c5861"/><text x="221" y="277" class="label" >VERSIONED COMMANDS + OBSERVATIONS</text><text x="221" y="303" class="small" >Permissions • previews • budgets • idempotent receipts</text><path d="M620 350v32" stroke="#e3ac70" marker-end="url(#arrow)"/><rect x="205" y="387" width="830" height="100" rx="4" fill="#152a32" stroke="#3c5861"/><text x="221" y="419" class="label" >AUTHORITATIVE WORLD SIMULATION</text><text x="221" y="445" class="small" >Inventories • jobs • crews • routes • service networks • commissioning</text><path d="M365 489v34M865 489v34" stroke="#e3ac70" marker-end="url(#arrow)"/><rect x="90" y="530" width="545" height="97" rx="4" fill="#152a32" stroke="#3c5861"/><text x="106" y="562" class="label" >Durable world + event history</text><text x="106" y="588" class="small" >Material custody, reservations, progress and lineage</text><rect x="670" y="530" width="480" height="97" rx="4" fill="#152a32" stroke="#3c5861"/><text x="686" y="562" class="label" >Isolated laboratory state</text><text x="686" y="588" class="small" >Same rules • controlled steps • separate resources</text></svg>