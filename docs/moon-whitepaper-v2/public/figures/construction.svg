<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="395" viewBox="0 0 1240 395" role="img" aria-labelledby="t d"><title id="t">A machine has a journey</title><desc id="d">Seven physical stages connect a placed plan to useful commissioned service.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#e3ac70"/></marker><linearGradient id="ground" x2="0.8" y2="1"><stop stop-color="#33494f"/><stop offset="1" stop-color="#172b32"/></linearGradient></defs><rect width="1240" height="395" fill="#102026" rx="5"/><style>text{font-family:system-ui,Arial,sans-serif;fill:#e7e9df}.small{font-size:15px;fill:#a6b6ba}.tag{font-family:monospace;font-size:12px;fill:#e3ac70;letter-spacing:2px}.label{font-size:19px}.muted{fill:#88a4ad}</style><text x="35" y="42" class="tag" >CONSTRUCTION / FROM INTENT TO SERVICE</text><rect x="35" y="95" width="153" height="130" rx="4" fill="#152a32" stroke="#3c5861"/><text x="51" y="123" class="tag" >01</text><text x="51" y="157" class="label" >Reserve</text><text x="51" y="182" class="small" >Parts and space</text><path d="M189 160h14" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="205" y="95" width="153" height="130" rx="4" fill="#152a32" stroke="#3c5861"/><text x="221" y="123" class="tag" >02</text><text x="221" y="157" class="label" >Supply</text><text x="221" y="182" class="small" >Make and deliver</text><path d="M359 160h14" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="375" y="95" width="153" height="130" rx="4" fill="#152a32" stroke="#3c5861"/><text x="391" y="123" class="tag" >03</text><text x="391" y="157" class="label" >Prepare</text><text x="391" y="182" class="small" >Ground and access</text><path d="M529 160h14" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="545" y="95" width="153" height="130" rx="4" fill="#152a32" stroke="#3c5861"/><text x="561" y="123" class="tag" >04</text><text x="561" y="157" class="label" >Assemble</text><text x="561" y="182" class="small" >Crew and tooling</text><path d="M699 160h14" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="715" y="95" width="153" height="130" rx="4" fill="#152a32" stroke="#3c5861"/><text x="731" y="123" class="tag" >05</text><text x="731" y="157" class="label" >Connect</text><text x="731" y="182" class="small" >Power and control</text><path d="M869 160h14" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="885" y="95" width="153" height="130" rx="4" fill="#152a32" stroke="#3c5861"/><text x="901" y="123" class="tag" >06</text><text x="901" y="157" class="label" >Commission</text><text x="901" y="182" class="small" >Test and calibrate</text><path d="M1039 160h14" stroke="#e3ac70" fill="none" marker-end="url(#arrow)"/><rect x="1055" y="95" width="153" height="130" rx="4" fill="#152a32" stroke="#3c5861"/><text x="1071" y="123" class="tag" >07</text><text x="1071" y="157" class="label" >Operate</text><text x="1071" y="182" class="small" >Useful output</text><path d="M110 245v25h1020v-25" fill="none" stroke="#42646e"/><text x="620" y="307" class="label" text-anchor="middle">Every stage has inputs, work, a location and a durable result.</text><text x="620" y="343" class="small" text-anchor="middle">Proposed workflow. Parallel work is allowed only where the recipe and site support it.</text></svg>